# Deploy the Zenput component gallery (`demo/`) to Cloudflare Pages.
#
# Production deploys run on pushes to the default branch; pull requests get a
# preview deployment whose URL is posted back as a PR comment.
#
# Required repository secrets (see `docs/deployment.md`):
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
# When either secret is missing (e.g. on a fork) the build still runs and only
# the deploy steps are skipped, so the workflow stays green.
name: Deploy Demo

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_PROJECT_NAME: zenput-demo

jobs:
  deploy:
    name: Build & deploy gallery
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      # The demo aliases `zenput` to `../src` (see demo/vite.config.ts), so the
      # library does NOT need to be built first — Vite bundles the sources
      # directly. The root dependencies are still installed because the demo's
      # `type-check` step type-checks `../src`, which resolves React (and other
      # peer) types from the root `node_modules`.
      # `--legacy-peer-deps` mirrors the resolution the committed lockfile was
      # generated with; a strict install currently fails on an unrelated
      # rollup-plugin-dts / typescript peer conflict.
      - name: Install root dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install demo dependencies
        run: npm ci --ignore-scripts
        working-directory: demo

      - name: Build gallery
        run: npm run build
        working-directory: demo

      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Cloudflare secrets are not configured — skipping deployment.'
          fi

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: demo
          command: >-
            pages deploy dist
            --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}

      - name: Comment preview URL on the pull request
        if: github.event_name == 'pull_request' && steps.creds.outputs.configured == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- zenput-demo-preview -->';
            const body = `${marker}\n### 🎨 Component gallery preview\n\n${process.env.PREVIEW_URL}\n\nBuilt from ${context.sha.substring(0, 7)}.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
